<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #0d0d0f 0%, #1a1a1e 55%, #232329 100%);
    color: #f2f2f3; position: relative;
  }
  /* 细网格背景 */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: relative; display: flex; height: 100%; padding: 0 72px; align-items: center; }

  .left { flex: 1.15; padding-right: 48px; }
  .brand { display: flex; align-items: baseline; gap: 20px; margin-bottom: 18px; }
  .brand .cn { font-size: 76px; font-weight: 700; letter-spacing: 4px; }
  .brand .en { font-size: 26px; color: #9a9aa2; font-weight: 400; letter-spacing: 1px; }
  .slogan { font-size: 27px; color: #c9c9cf; margin-bottom: 34px; font-weight: 300; letter-spacing: 1px; }
  .slogan b { color: #ffffff; font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 12px; max-width: 560px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    font-size: 17px; color: #d6d6dc;
  }
  .chip span { color: #8f8f98; }

  .meta { margin-top: 44px; display: flex; gap: 28px; align-items: center; font-size: 15px; color: #77777f; }
  .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: #55555c; }

  .right { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; }
  .phone {
    width: 300px; border-radius: 30px; overflow: hidden;
    box-shadow: 0 28px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.09);
    transform: rotate(1.5deg);
  }
  .phone img { display: block; width: 100%; }
  .badge {
    position: absolute; right: 4px; bottom: 64px;
    background: rgba(20,20,24,0.92); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 14px; padding: 12px 18px; font-size: 15px; color: #cfcfd6;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: rotate(-1.5deg);
    backdrop-filter: blur(6px);
  }
  .badge b { color: #fff; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <div class="cn">随记</div>
        <div class="en">FloatNote · 悬浮笔记</div>
      </div>
      <div class="slogan">任何时候记一笔，<b>不打断正在做的事</b></div>
      <div class="chips">
        <div class="chip">📍 贴边竖条 <span>几乎不占注意力</span></div>
        <div class="chip">👆 一点即开 <span>原位浮现</span></div>
        <div class="chip">⇄ 左右镜像 <span>单手通吃</span></div>
        <div class="chip">⌨ 键盘避让 <span>自动上浮</span></div>
        <div class="chip">🗂 回收站 · 备份</div>
        <div class="chip">🔒 数据只在本地</div>
      </div>
      <div class="meta">
        <div>Android 8.0+</div><div class="dot"></div>
        <div>Kotlin · Compose</div><div class="dot"></div>
        <div>MIT License</div>
      </div>
    </div>
    <div class="right">
      <div class="phone"><img src="screenshots/floating.png"></div>
      <div class="badge">桌面随手记 · <b>收起只留一根竖条</b></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0d0d10;
    color: #f2f2f3; position: relative;
  }
  /* 纵深渐变 + 中央光晕 */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 900px 600px at 68% 42%, rgba(88,96,255,0.13), transparent 60%),
      radial-gradient(ellipse 700px 500px at 40% 70%, rgba(255,255,255,0.05), transparent 65%),
      linear-gradient(135deg, #0b0b0e 0%, #141418 55%, #1c1c22 100%);
  }
  .bg::after {
    content:""; position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 75% 75% at 50% 45%, #000 40%, transparent 100%);
  }

  .wrap { position: relative; display: flex; height: 100%; padding: 0 64px; align-items: center; }

  /* ---- 左侧文字 ---- */
  .left { flex: 1.1; padding-right: 36px; z-index: 5; }
  .brand { display: flex; align-items: baseline; gap: 18px; margin-bottom: 16px; }
  .brand .cn { font-size: 78px; font-weight: 700; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffffff 30%, #b9b9c2 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .brand .en { font-size: 24px; color: #8d8d96; font-weight: 400; letter-spacing: 1px; }
  .slogan { font-size: 28px; color: #d4d4da; margin-bottom: 36px; font-weight: 300; letter-spacing: 2px; }
  .slogan b { color: #fff; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 11px; max-width: 520px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 9px 16px; border-radius: 999px; font-size: 16px; color: #d9d9df;
    background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.11);
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .chip span { color: #84848d; font-size: 14.5px; }
  .meta { margin-top: 40px; display: flex; gap: 22px; align-items: center; font-size: 14.5px; color: #6f6f78; }
  .meta .dot { width: 4px; height: 4px; border-radius: 50%; background: #4c4c55; }

  /* ---- 右侧三机 3D ---- */
  .stage { flex: 1; height: 100%; position: relative; perspective: 1700px; z-index: 4; }
  .phone { position: absolute; border-radius: 30px; overflow: hidden; background: #000; }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .phone .glare {
    position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(112deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.03) 24%, transparent 42%, transparent 72%, rgba(255,255,255,0.05) 100%);
  }
  .phone::before { /* 金属边框 */
    content: ""; position: absolute; inset: -3px; border-radius: 33px; z-index: -1;
    background: linear-gradient(165deg, #56565e 0%, #232327 38%, #101013 100%);
  }
  .phone::after { /* 投影 */
    content: ""; position: absolute; left: 8%; right: 8%; bottom: -34px; height: 46px; z-index: -2;
    background: radial-gradient(ellipse 50% 100% at 50% 0%, rgba(0,0,0,0.55), transparent 70%);
    filter: blur(8px);
  }

  .p-main { width: 284px; height: 505px; left: 50%; top: 50%;
    transform: translate(-54%, -52%) rotateY(-7deg) rotateX(2deg); z-index: 30; }
  .p-left { width: 236px; height: 420px; left: 4%; top: 56%;
    transform: translateY(-50%) rotateY(30deg) rotateX(3deg); z-index: 10; opacity: .9; filter: brightness(.78); }
  .p-right { width: 236px; height: 420px; right: 1%; top: 46%;
    transform: translateY(-50%) rotateY(-32deg) rotateX(4deg); z-index: 10; opacity: .9; filter: brightness(.78); }

  /* 呼吸光斑 */
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); z-index: 1; }
  .o1 { width: 300px; height: 300px; right: 8%; top: 8%; background: rgba(99,106,255,0.16); }
  .o2 { width: 200px; height: 200px; left: 30%; bottom: 4%; background: rgba(255,255,255,0.07); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="left">
      <div class="brand">
        <div class="cn">随记</div>
        <div class="en">FloatNote · 悬浮笔记</div>
      </div>
      <div class="slogan">任何时候随手一点，<b>记录转瞬即逝的灵感</b></div>
      <div class="chips">
        <div class="chip">📍 贴边竖条 <span>不占注意力</span></div>
        <div class="chip">👆 一点即开 <span>原位浮现</span></div>
        <div class="chip">⇄ 左右镜像 <span>单手通吃</span></div>
        <div class="chip">⌨ 键盘避让 <span>自动上浮</span></div>
        <div class="chip">🔒 数据只在本地</div>
      </div>
      <div class="meta">
        <div>Android 8.0+</div><div class="dot"></div>
        <div>Kotlin · Compose</div><div class="dot"></div>
        <div>MIT License</div>
      </div>
    </div>
    <div class="stage">
      <div class="orb o1"></div><div class="orb o2"></div>
      <div class="phone p-left"><img src="screenshots/collapsed.png"><div class="glare"></div></div>
      <div class="phone p-right"><img src="screenshots/home.png"><div class="glare"></div></div>
      <div class="phone p-main"><img src="screenshots/floating.png"><div class="glare"></div></div>
    </div>
  </div>
</body>
</html>
